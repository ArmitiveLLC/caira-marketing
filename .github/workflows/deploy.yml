name: Deploy Marketing Site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-marketing-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to Firebase Hosting
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Firebase Hosting (caira-care site)
        run: npx firebase deploy --only hosting:caira-care --project caira-prod --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
